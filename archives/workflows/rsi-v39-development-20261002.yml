name: V39 public novelty-frontier development

on:
  pull_request:
    paths:
      - 'experiment/rsi_v39/**'
      - 'tests/test_rsi_v39.py'
      - '.github/workflows/rsi-v39-development.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: V39 boundary tests
        run: pytest -q tests/test_rsi_v39.py
      - name: Run consumed-data public pilot
        run: python -m experiment.rsi_v39.development | tee v39-public-development.log
      - name: Verify generated development evidence
        run: python -c "from experiment.rsi_v39 import development; print(development.verify(replay=False))"
      - uses: actions/upload-artifact@v4
        with:
          name: v39-public-development
          path: |
            experiment/rsi_v39/DEVELOPMENT.json.gz
            experiment/rsi_v39/DEVELOPMENT_RESERVATION.json
            v39-public-development.log
