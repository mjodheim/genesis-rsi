# Without an explicit build system and package list, `pip install -e ".[dev]"` —
# the command documented in the README and in docs/REPRODUCIBILITY.md — fails because
# setuptools refuses flat-layout discovery when `results/`, `archives/` and
# `experiments/` live next to the package. The former CI never exposed this because it
# installed dependencies manually without reading this file.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-genesis"
version = "0.44.0"
description = "Auditable adaptive-embodiment and trans-substrate continuity research"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "LICENSES/CC-BY-4.0.txt"]
authors = [
  { name = "Anthony Mets" },
]
requires-python = ">=3.11"
# `numpy` is the only distribution runtime dependency. Experimental OE1
# PostgreSQL support is installed from deploy/oe1/requirements.txt so repository
# experiments remain local rather than becoming package dependencies.
dependencies = [
  "numpy",
]

[project.optional-dependencies]
# `pytest-xdist` is a test *runner*, never imported by the project. It is included so the
# growing repository-wide suite can be run concurrently with `-n 10 --dist loadscope`.
dev = ["pytest", "pytest-xdist"]

[tool.setuptools]
# `scripts/` contains repository entry points executed from the project root rather
# than an installable package; `pytest.ini_options.pythonpath` exposes it to tests.
packages = ["genesis", "metamorphosis", "mira_core"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests", "experiment/rsi_v25"]
