name: Attribution policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: attribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    name: Human-only attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fetch the proposed commit without checking it out
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          git fetch --no-tags origin
          "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pull/${PR_NUMBER}/head"
      - name: Check commit and pull-request attribution from trusted code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/check_attribution_policy.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --event "$EVENT_PATH"
