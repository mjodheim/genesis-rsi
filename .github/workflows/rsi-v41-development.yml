name: V41 public stagnation4-frontier development
on:
  pull_request:
    paths:
      - 'experiment/rsi_v41/**'
      - 'tests/test_rsi_v41.py'
      - '.github/workflows/rsi-v41-development.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_rsi_v41.py
      - run: python -m experiment.rsi_v41.development | tee v41-public-development.log
      - run: python -c "from experiment.rsi_v41 import development; print(development.verify(replay=False))"
