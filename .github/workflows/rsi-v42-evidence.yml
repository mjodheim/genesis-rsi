name: RSI V42 preserved prospective evidence
on:
  push:
    branches: [main, research/rsi-v42-last-chance-frontier-dev]
    paths:
      - 'results/rsi-v42/**'
      - 'experiment/rsi_v42/**'
      - 'scripts/check_rsi_v42_evidence.py'
      - 'tests/test_rsi_v42_evidence.py'
      - '.github/workflows/rsi-v42-evidence.yml'
  pull_request:
    branches: [main, research/rsi-v41-stagnation4-frontier-dev]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.16'
      - run: python -m pip install -e '.[dev]'
      - name: Require the complete original prefix and replay receipts
        run: python -m scripts.check_rsi_v42_evidence
      - name: Verify publication gate failure modes
        run: python -m pytest -q tests/test_rsi_v42_evidence.py
