name: M141 V42 prospective freeze
on:
  push:
    branches:
      - research/rsi-v42-last-chance-frontier-dev
    paths:
      - 'experiment/rsi_v42/**'
      - 'tests/test_rsi_v42.py'
      - 'tests/test_rsi_v42_fresh.py'
      - '.github/workflows/rsi-v42-development.yml'
      - '.github/workflows/rsi-v42-freeze.yml'
      - '.github/workflows/rsi-v42-fresh-prefix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    if: ${{ !contains(github.event.head_commit.message || '', 'commit prospective V42 freeze') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/rsi-v42-last-chance-frontier-dev
          fetch-depth: 0
      - name: Detect committed freeze
        id: frozen
        run: |
          if git ls-files --error-unmatch experiment/rsi_v42/V42_SCIENTIFIC_FREEZE.json >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.frozen.outputs.exists != 'true'
        with:
          python-version: '3.11'
      - name: Install
        if: steps.frozen.outputs.exists != 'true'
        run: python -m pip install -e ".[dev]"
      - name: Recheck targeted boundaries
        if: steps.frozen.outputs.exists != 'true'
        run: pytest -q tests/test_rsi_v42.py tests/test_rsi_v42_fresh.py
      - name: Build prospective freeze
        if: steps.frozen.outputs.exists != 'true'
        run: python -m experiment.rsi_v42.freeze
      - name: Commit freeze before any fresh behavior
        if: steps.frozen.outputs.exists != 'true'
        run: |
          git config user.name "Anthony Mets"
          git config user.email "110968830+mjodheim@users.noreply.github.com"
          git add experiment/rsi_v42/V42_SCIENTIFIC_FREEZE.json
          git commit -m "research(v42): commit prospective V42 freeze

          Freeze new seeds, unchanged G7, last-chance memory policy, controls,
          costs and scientific inputs before any fresh V42 behavior. L9 and L10
          remain explicitly false.

          Signed-off-by: Anthony Mets <110968830+mjodheim@users.noreply.github.com>"
          git push origin HEAD:research/rsi-v42-last-chance-frontier-dev
