name: V42 clean evidence preservation
on:
  push:
    branches:
      - research/rsi-v42-evidence-clean

permissions:
  contents: write

jobs:
  preserve:
    if: ${{ !contains(github.event.head_commit.message || '', 'preserve exact consumed-data pilot evidence') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/rsi-v42-evidence-clean
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_rsi_v42.py
      - name: Reproduce exact consumed-data pilot
        run: |
          python -m experiment.rsi_v42.development
          python - <<'PY'
          from experiment.rsi_v42 import development
          result = development.verify(replay=False)
          expected = "aac21e2bbac34c0bb5fd8773c6be139a64811cd4a6a8d098ad19166b687689ed"
          if result["development_bytes_sha256"] != expected:
              raise SystemExit(f"unexpected V42 development hash: {result}")
          print(result)
          PY
      - name: Commit evidence from the real branch head
        run: |
          git config user.name "Anthony Mets"
          git config user.email "110968830+mjodheim@users.noreply.github.com"
          git add -f experiment/rsi_v42/DEVELOPMENT.json.gz experiment/rsi_v42/DEVELOPMENT_RESERVATION.json
          git commit -m "research(v42): preserve exact consumed-data pilot evidence

          Reproduces adaptive 96/120, cold 95/120, 34 versus 33 novel solving
          behaviors and 903 versus 1043 charged evaluations. Development only;
          no fresh V42 task has been consumed and L9/L10 remain unpassed.

          Signed-off-by: Anthony Mets <110968830+mjodheim@users.noreply.github.com>"
          git push origin HEAD:research/rsi-v42-evidence-clean
